version: '3.8'

services:
  pdfcraft-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:8080"
    environment:
      - GO_ENV=production
      - PORT=8080
      - MAX_FILE_SIZE=50MB
      - CACHE_TTL=3600
      - LOG_LEVEL=info
      - ENABLE_CORS=true
      - RATE_LIMIT_REQUESTS=100
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads:/app/uploads
      - cache:/app/cache
      - temp:/app/temp
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pdfcraft-api
    restart: unless-stopped

volumes:
  uploads:
  cache:
  temp:
  redis_data: