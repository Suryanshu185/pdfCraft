version: '3.8'

services:
  pdfcraft-api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/root/uploads
      - ./temp:/root/temp
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s